name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  D2_VERSION: v0.9.0

jobs:
  coding-standards:
    name: PHP-CS-Fixer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - name: Validate composer.json
        run: composer validate --strict

      - uses: ramsey/composer-install@v3

      - name: Run PHP-CS-Fixer
        run: vendor/bin/php-cs-fixer check --diff --show-progress=none

  static-analysis:
    name: PHPStan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - uses: ramsey/composer-install@v3

      - name: Run PHPStan
        run: vendor/bin/phpstan analyse --no-progress --error-format=github

  architecture:
    name: Deptrac
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - uses: ramsey/composer-install@v3

      - name: Run Deptrac
        run: vendor/bin/deptrac analyse --no-progress --report-uncovered --fail-on-uncovered --formatter=github-actions

  tests:
    name: PHPUnit (PHP ${{ matrix.php }}, ${{ matrix.dependencies }} deps)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.2'
            dependencies: lowest
          - php: '8.2'
            dependencies: highest
          - php: '8.5'
            dependencies: highest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - uses: ramsey/composer-install@v3
        with:
          dependency-versions: ${{ matrix.dependencies }}

      - name: Install d2 ${{ env.D2_VERSION }}
        run: |
          curl -fsSL "https://github.com/terrastruct/d2/releases/download/${D2_VERSION}/d2-${D2_VERSION}-linux-amd64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/d2-${D2_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Check d2 version
        run: d2 --version

      - name: Run PHPUnit
        run: vendor/bin/phpunit
        env:
          D2_REQUIRED: '1'

  download:
    name: d2:download (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # linux-amd64, macos-arm64 and windows-amd64 release assets
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: phar, zlib
          coverage: none

      - uses: ramsey/composer-install@v3

      - name: Download, verify and run the real d2 binary
        shell: bash
        run: vendor/bin/phpunit tests/Unit/Downloader tests/Integration/Downloader
        env:
          D2_DOWNLOAD_TEST: '1'

  # Single required status check for the "Protect main" ruleset, so the matrix
  # can change without touching branch protection. Add every new job to "needs".
  ci-passed:
    name: CI passed
    if: always()
    needs: [coding-standards, static-analysis, architecture, tests, download]
    runs-on: ubuntu-latest
    steps:
      - name: Check all jobs succeeded
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
